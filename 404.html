<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Seite nicht gefunden – Matherechner</title>
<meta name="robots" content="noindex, follow">
<link rel="icon" type="image/webp" href="/images/favicon%20matherechner.webp">
<link rel="shortcut icon" href="/images/favicon%20matherechner.webp">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Poppins,-apple-system,"Segoe UI",Roboto,sans-serif;background:#1A212E;color:#B8C0CE;display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;text-align:center;padding:24px}
.logo-ic{width:48px;height:48px;border-radius:12px;background:linear-gradient(135deg,#9F7FFF,#7F60F0);display:flex;align-items:center;justify-content:center;color:#fff;font-weight:800;font-size:22px;margin:0 auto 20px}
h1{font-size:clamp(48px,8vw,96px);font-weight:800;color:rgba(255,255,255,.08);letter-spacing:-.04em;line-height:1}
p{font-size:17px;color:#B8C0CE;margin:16px 0 32px}
a{display:inline-block;background:linear-gradient(135deg,#9F7FFF,#7F60F0);color:#fff;text-decoration:none;padding:12px 28px;border-radius:10px;font-weight:600;font-size:15px;transition:opacity .15s}
a:hover{opacity:.88}
.site-header{position:absolute;top:0;left:0;right:0;z-index:100;background:transparent;border-bottom:1px solid rgba(255,255,255,.3);text-align:left}
.site-header-inner{max-width:1080px;margin:0 auto;padding:5px 22px;display:flex;align-items:center;justify-content:space-between}
.site-logo,.site-logo:hover{display:flex;background:none;padding:0;border-radius:0;opacity:1}
.site-logo img{height:65px;width:auto;display:block}
.site-nav{display:flex;align-items:center;gap:4px}
.site-nav a{display:block;background:transparent;color:#C7CEDB;padding:6px 12px;border-radius:8px;font-size:16px;font-weight:500}
.site-nav a:hover{color:#fff;background:rgba(255,255,255,.07);opacity:1}
.site-nav a.active{color:#7F60F0;border-bottom:2px solid #7F60F0;border-radius:0;padding-bottom:4px}
.site-burger{display:none;background:none;border:1px solid rgba(255,255,255,.2);border-radius:8px;color:#fff;font-size:18px;padding:4px 10px;cursor:pointer;line-height:1}
@media(max-width:760px){.site-nav{display:none;position:absolute;top:58px;right:22px;left:22px;background:#121B2E;border:1px solid rgba(255,255,255,.1);border-radius:12px;padding:12px;flex-direction:column;align-items:stretch;gap:2px;box-shadow:0 16px 40px rgba(0,0,0,.5)}.site-nav.open{display:flex}.site-burger{display:block}}
</style>
</head>
<body>
<header class="site-header">
  <div class="site-header-inner">
    <a class="site-logo" href="/"><img src="/images/Matherechnerlogo.webp" alt="Matherechner Logo" loading="eager"></a>
    <nav class="site-nav" id="site-nav" aria-label="Hauptnavigation">
      <a href="/" class="active">Matherechner</a>
      <a href="/ueber-uns/">Über uns</a>
      <a href="/kontakt/">Kontakt</a>
    </nav>
    <button class="site-burger" id="site-burger" aria-label="Menü öffnen" aria-expanded="false">&#9776;</button>
  </div>
</header>
<div class="logo-ic">&#247;</div>
<h1>404</h1>
<p>Diese Seite wurde nicht gefunden.</p>
<a href="/">Zurück zur Startseite</a>
<script>
var b=document.getElementById('site-burger'),n=document.getElementById('site-nav');
if(b&&n)b.addEventListener('click',function(){var open=n.classList.toggle('open');b.setAttribute('aria-expanded',open);});
</script>
</body>
</html>
